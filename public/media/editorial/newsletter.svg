<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <defs>
    <linearGradient id="skyeditorialnewsletter" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#503326"/>
      <stop offset="100%" stop-color="#624131"/>
    </linearGradient>
    <radialGradient id="vigeditorialnewsletter" cx="50%" cy="44%" r="82%">
      <stop offset="68%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="graineditorialnewsletter" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="grain">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="frameeditorialnewsletter">
      <rect x="0" y="0" width="1600" height="900"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameeditorialnewsletter)">
    <rect width="1600" height="900" fill="url(#skyeditorialnewsletter)"/>
    <rect x="0" y="560.84" width="1600" height="339.16" fill="#875F49"/>
    <circle cx="723.76" cy="418.26" r="397.33" fill="#BC8B69"/>
    <path d="M 723.76 20.93 A 397.33 397.33 0 0 1 723.76 815.6 Z" fill="#503326" opacity="0.42"/>
    <circle cx="723.76" cy="418.26" r="397.33" fill="none" stroke="#F2EDE6" stroke-width="3.6" opacity="0.8"/>
    <line x1="0" y1="560.84" x2="1600" y2="560.84" stroke="#F2EDE6" stroke-width="2.7" opacity="0.7"/>
    <rect width="1600" height="900" fill="url(#vigeditorialnewsletter)"/>
    <rect width="1600" height="900" filter="url(#graineditorialnewsletter)" opacity="0.13" style="mix-blend-mode:overlay"/>
    
  </g>
</svg>
