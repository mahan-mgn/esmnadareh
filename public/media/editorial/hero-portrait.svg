<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600" role="img">
  <defs>
    <linearGradient id="skyeditorialheroportrait" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0C0A0A"/>
      <stop offset="100%" stop-color="#131010"/>
    </linearGradient>
    <radialGradient id="vigeditorialheroportrait" cx="50%" cy="44%" r="82%">
      <stop offset="68%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="graineditorialheroportrait" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="grain">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="frameeditorialheroportrait">
      <rect x="0" y="0" width="1200" height="1600"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameeditorialheroportrait)">
    <rect width="1200" height="1600" fill="url(#skyeditorialheroportrait)"/>
    <polygon points="-240,-480 1440,-687.35 1440,-175.35 -240,32" fill="#0C0A0A" opacity="0.8"/>
    <polygon points="-240,32 1440,-175.35 1440,336.65 -240,544" fill="#221E1D" opacity="0.6"/>
    <polygon points="-240,544 1440,336.65 1440,848.65 -240,1056" fill="#453E3A" opacity="0.8"/>
    <polygon points="-240,1056 1440,848.65 1440,1360.65 -240,1568" fill="#221E1D" opacity="0.96"/>
    <polygon points="-240,1568 1440,1360.65 1440,1872.65 -240,2080" fill="#0C0A0A" opacity="0.98"/>
    <polygon points="-240,1081.72 1440,874.37 1440,956.29 -240,1163.64" fill="#A8412E" opacity="0.75"/>
    <rect width="1200" height="1600" fill="url(#vigeditorialheroportrait)"/>
    <rect width="1200" height="1600" filter="url(#graineditorialheroportrait)" opacity="0.13" style="mix-blend-mode:overlay"/>
    
  </g>
</svg>
