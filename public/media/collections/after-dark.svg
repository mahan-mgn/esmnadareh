<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" width="1800" height="1100" role="img">
  <defs>
    <linearGradient id="skycollectionafterdark" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0C0A0A"/>
      <stop offset="100%" stop-color="#131010"/>
    </linearGradient>
    <radialGradient id="vigcollectionafterdark" cx="50%" cy="44%" r="82%">
      <stop offset="68%" stop-color="#000" stop-opacity="0"/>
