<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img">
  <defs>
    <linearGradient id="skycategorybags" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#503326"/>
      <stop offset="100%" stop-color="#624131"/>
    </linearGradient>
    <radialGradient id="vigcategorybags" cx="50%" cy="44%" r="82%">
      <stop offset="68%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="graincategorybags" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="grain">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="framecategorybags">
      <rect x="0" y="0" width="1000" height="1250"/>
    </clipPath>
  </defs>

  <g clip-path="url(#framecategorybags)">
    <rect width="1000" height="1250" fill="url(#skycategorybags)"/>
    <rect x="0" y="892.53" width="1000" height="357.47" fill="#875F49"/>
    <ellipse cx="557.92" cy="910.03" rx="245.08" ry="27.5" fill="#503326" opacity="0.65"/>
    <ellipse cx="470.39" cy="681.84" rx="175.06" ry="210.69" fill="#BC8B69"/>
    <rect x="295.34" y="471.15" width="119.04" height="421.39" fill="#503326" opacity="0.35"/>
    <line x1="0" y1="892.53" x2="1000" y2="892.53" stroke="#F2EDE6" stroke-width="3" opacity="0.75"/>
    <rect width="1000" height="1250" fill="url(#vigcategorybags)"/>
    <rect width="1000" height="1250" filter="url(#graincategorybags)" opacity="0.13" style="mix-blend-mode:overlay"/>
    <text x="45" y="1206.25" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="8" fill="#F2EDE6" opacity="0.45">BAGS</text>
