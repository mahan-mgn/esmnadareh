<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img">
  <defs>
    <linearGradient id="skycategorydecor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#383B2E"/>
      <stop offset="100%" stop-color="#434535"/>
    </linearGradient>
    <radialGradient id="vigcategorydecor" cx="50%" cy="44%" r="82%">
      <stop offset="68%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="graincategorydecor" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="grain">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="framecategorydecor">
      <rect x="0" y="0" width="1000" height="1250"/>
    </clipPath>
  </defs>

  <g clip-path="url(#framecategorydecor)">
    <rect width="1000" height="1250" fill="url(#skycategorydecor)"/>
    <rect x="0" y="781.41" width="1000" height="468.59" fill="#5A5B45"/>
    <ellipse cx="607.96" cy="798.91" rx="262.8" ry="27.5" fill="#383B2E" opacity="0.65"/>
    <rect x="326.39" y="432.12" width="375.43" height="349.3" rx="174.65" fill="#868864"/>
    <rect x="326.39" y="432.12" width="127.65" height="349.3" fill="#383B2E" opacity="0.35"/>
    <line x1="0" y1="781.41" x2="1000" y2="781.41" stroke="#F2EDE6" stroke-width="3" opacity="0.75"/>
    <rect width="1000" height="1250" fill="url(#vigcategorydecor)"/>
    <rect width="1000" height="1250" filter="url(#graincategorydecor)" opacity="0.13" style="mix-blend-mode:overlay"/>
    <text x="45" y="1206.25" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="8" fill="#F2EDE6" opacity="0.45">DECOR</text>
