<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img">
  <defs>
    <linearGradient id="skycategoryclothing" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0C0A0A"/>
      <stop offset="100%" stop-color="#131010"/>
