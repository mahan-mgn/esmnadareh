<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img">
  <defs>
    <linearGradient id="skyplainleatherbelt1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#E5D9C4"/>
      <stop offset="100%" stop-color="#dacbb2"/>
