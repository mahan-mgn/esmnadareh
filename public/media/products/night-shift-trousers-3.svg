<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img">
  <defs>
    <linearGradient id="skynightshifttrousers2" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#C6C3BF"/>
      <stop offset="100%" stop-color="#b6b3af"/>
    </linearGradient>
    <radialGradient id="vignightshifttrousers2" cx="50%" cy="44%" r="82%">
      <stop offset="68%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="grainnightshifttrousers2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="grain">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="framenightshifttrousers2">
      <rect x="0" y="0" width="1200" height="1500"/>
    </clipPath>
  </defs>

  <g clip-path="url(#framenightshifttrousers2)">
