    <rect x="0" y="969.28" width="1200" height="530.72" fill="#95918C"/>
    <ellipse cx="748.27" cy="990.28" rx="332.52" ry="33" fill="#C6C3BF" opacity="0.65"/>
    <ellipse cx="629.51" cy="721.21" rx="237.52" ry="248.06" fill="#57534F"/>
    <rect x="392" y="473.15" width="161.51" height="496.13" fill="#C6C3BF" opacity="0.35"/>
    <line x1="0" y1="969.28" x2="1200" y2="969.28" stroke="#141211" stroke-width="3.6" opacity="0.75"/>
    <rect width="1200" height="1500" fill="url(#vignightshifttrousers2)"/>
    <rect width="1200" height="1500" filter="url(#grainnightshifttrousers2)" opacity="0.13" style="mix-blend-mode:overlay"/>
    
