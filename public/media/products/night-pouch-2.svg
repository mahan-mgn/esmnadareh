<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img">
  <defs>
    <linearGradient id="skynightpouch1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#240E0D"/>
      <stop offset="100%" stop-color="#331412"/>
    </linearGradient>
    <radialGradient id="vignightpouch1" cx="50%" cy="44%" r="82%">
      <stop offset="68%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="grainnightpouch1" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="grain">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="framenightpouch1">
      <rect x="0" y="0" width="1200" height="1500"/>
    </clipPath>
  </defs>

  <g clip-path="url(#framenightpouch1)">
    <rect width="1200" height="1500" fill="url(#skynightpouch1)"/>
    <rect x="0" y="1022.49" width="1200" height="477.51" fill="#54221E"/>
    <ellipse cx="708.47" cy="1043.49" rx="358.05" ry="33" fill="#240E0D" opacity="0.65"/>
    <ellipse cx="580.6" cy="775.12" rx="255.75" ry="247.37" fill="#8C3A2F"/>
    <rect x="324.84" y="527.75" width="173.91" height="494.74" fill="#240E0D" opacity="0.35"/>
    <line x1="0" y1="1022.49" x2="1200" y2="1022.49" stroke="#D68F7C" stroke-width="3.6" opacity="0.75"/>
    <rect width="1200" height="1500" fill="url(#vignightpouch1)"/>
    <rect width="1200" height="1500" filter="url(#grainnightpouch1)" opacity="0.13" style="mix-blend-mode:overlay"/>
    
  </g>
</svg>
