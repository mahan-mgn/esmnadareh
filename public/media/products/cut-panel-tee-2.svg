<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img">
  <defs>
    <linearGradient id="skycutpaneltee1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5E2015"/>
      <stop offset="100%" stop-color="#71281b"/>
    </linearGradient>
    <radialGradient id="vigcutpaneltee1" cx="50%" cy="44%" r="82%">
      <stop offset="68%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="graincutpaneltee1" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="grain">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="framecutpaneltee1">
      <rect x="0" y="0" width="1200" height="1500"/>
    </clipPath>
  </defs>

  <g clip-path="url(#framecutpaneltee1)">
    <rect width="1200" height="1500" fill="url(#skycutpaneltee1)"/>
    <rect x="0" y="1010.73" width="1200" height="489.27" fill="#9A3A29"/>
    <ellipse cx="687.95" cy="1031.73" rx="279.78" ry="33" fill="#5E2015" opacity="0.65"/>
    <rect x="388.19" y="560.5" width="399.69" height="450.23" rx="199.84" fill="#C9613C"/>
    <rect x="388.19" y="560.5" width="135.89" height="450.23" fill="#5E2015" opacity="0.35"/>
    <line x1="0" y1="1010.73" x2="1200" y2="1010.73" stroke="#F2EDE6" stroke-width="3.6" opacity="0.75"/>
    <rect width="1200" height="1500" fill="url(#vigcutpaneltee1)"/>
    <rect width="1200" height="1500" filter="url(#graincutpaneltee1)" opacity="0.13" style="mix-blend-mode:overlay"/>
    
  </g>
</svg>
