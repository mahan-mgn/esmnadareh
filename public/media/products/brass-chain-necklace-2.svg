<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img">
  <defs>
    <linearGradient id="skybrasschainnecklace1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#503326"/>
      <stop offset="100%" stop-color="#624131"/>
    </linearGradient>
    <radialGradient id="vigbrasschainnecklace1" cx="50%" cy="44%" r="82%">
      <stop offset="68%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="grainbrasschainnecklace1" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="grain">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="framebrasschainnecklace1">
      <rect x="0" y="0" width="1200" height="1500"/>
    </clipPath>
  </defs>

  <g clip-path="url(#framebrasschainnecklace1)">
    <rect width="1200" height="1500" fill="url(#skybrasschainnecklace1)"/>
    <rect x="0" y="1035.16" width="1200" height="464.84" fill="#875F49"/>
    <ellipse cx="711.76" cy="1056.16" rx="314.93" ry="33" fill="#503326" opacity="0.65"/>
    <ellipse cx="599.29" cy="789.33" rx="224.95" ry="245.83" fill="#BC8B69"/>
    <rect x="374.33" y="543.5" width="152.97" height="491.65" fill="#503326" opacity="0.35"/>
    <line x1="0" y1="1035.16" x2="1200" y2="1035.16" stroke="#F2EDE6" stroke-width="3.6" opacity="0.75"/>
    <rect width="1200" height="1500" fill="url(#vigbrasschainnecklace1)"/>
    <rect width="1200" height="1500" filter="url(#grainbrasschainnecklace1)" opacity="0.13" style="mix-blend-mode:overlay"/>
    
  </g>
</svg>
